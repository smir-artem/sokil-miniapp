<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сокіл Цифровий · Кабінет директора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Сокіл Цифровий — кабінет директора (2.13.0, ДЕМО). Клубні кольори (брендбук): жовтий #FFEC02, чорний, білий;
   Montserrat, акцентні заголовки — Black Italic; стиль Borussia Dortmund. Дві теми: темна (типово) і світла. */
:root{
  --y:#FFEC02; --on-y:#0A0A0A;
  --bg:#0A0A0A; --side:#000; --panel:#111; --card:#161616; --card2:#1D1D1D; --line:#262626;
  --text:#FFFFFF; --sub:#A8A8A8; --ink:#FFEC02;
  --ok:#5BE49B; --okb:#12301F; --wr:#FFB04D; --wrb:#3A2400; --er:#FF8A80; --erb:#3A1210; --in:#7CC4FF; --inb:#10243A;
  --shadow:0 1px 0 rgba(255,255,255,.04);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F4F1; --side:#0A0A0A; --panel:#FFFFFF; --card:#FFFFFF; --card2:#F7F7F4; --line:#E3E3DE;
  --text:#0A0A0A; --sub:#5F5F5A; --ink:#0A0A0A;
  --ok:#14713A; --okb:#E2F4E8; --wr:#8F5400; --wrb:#FFF0D2; --er:#B3261E; --erb:#FCE7E5; --in:#0B5CAD; --inb:#E4EFFB;
  --shadow:0 1px 2px rgba(0,0,0,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;height:100dvh}
/* ── бокове меню (завжди чорне, як шапки BVB) ── */
.side{background:var(--side);color:#fff;display:flex;flex-direction:column;min-height:0;border-right:1px solid #1a1a1a}
.brand{padding:18px 18px 14px;border-bottom:1px solid #1f1f1f}
.brand b{display:block;font-weight:900;font-style:italic;font-size:21px;letter-spacing:.3px;line-height:1.05;text-transform:uppercase}
.brand b span{color:var(--y)}
.brand small{display:block;color:#9a9a9a;font-size:11px;margin-top:6px;letter-spacing:.4px;text-transform:uppercase}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;cursor:pointer;color:#d8d8d8;font-weight:600;font-size:13.5px}
.nav button:hover{background:#151515;color:#fff}
.nav button.on{background:var(--y);color:#000}
.nav .ic{width:22px;text-align:center;font-size:16px}
.nav .cnt{margin-left:auto;background:#262626;color:#fff;border-radius:20px;padding:1px 8px;font-size:11.5px;font-weight:700}
.nav button.on .cnt{background:#000;color:var(--y)}
.nav .cnt.hot{background:var(--er);color:#000}
.side-foot{padding:12px 16px;border-top:1px solid #1f1f1f;font-size:11.5px;color:#8a8a8a}
.side-foot .who{color:#fff;font-weight:700;font-size:12.5px}
/* ── основна частина ── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{margin:0;font-weight:900;font-style:italic;font-size:20px;text-transform:uppercase;letter-spacing:.2px;white-space:nowrap}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:220px}
.search input{all:unset;flex:1;font-size:13px}
.iconbtn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:600;font-size:12.5px;white-space:nowrap;background:var(--card)}
.iconbtn:hover{border-color:var(--sub)}
.demo-flag{background:var(--y);color:#000;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.4px}
.content{flex:1;min-height:0;overflow:auto;padding:18px 20px 40px}
.content.split{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:0;padding:0;overflow:hidden}
.pane{min-height:0;overflow:auto}
.pane.list{border-right:1px solid var(--line);background:var(--panel)}
.pane.detail{padding:20px 24px 40px}
.btn.mback{display:none}
/* ── елементи ── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 6px}
.tab{all:unset;cursor:pointer;padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-weight:600;font-size:12.5px;background:var(--card)}
.tab.on{background:var(--y);border-color:var(--y);color:#000}
.tab .n{opacity:.7;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 14px 10px}
.chip{all:unset;cursor:pointer;padding:3px 9px;border-radius:8px;font-size:12px;border:1px dashed var(--line);color:var(--sub)}
.chip.on{border-style:solid;border-color:var(--text);color:var(--text)}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px;cursor:pointer}
.row:hover{background:var(--card2)}
.row.sel{background:var(--card2);box-shadow:inset 3px 0 0 var(--y)}
.row .t{display:flex;gap:8px;align-items:baseline}
.row .t b{font-weight:700;font-size:13.5px}
.row .t .r{margin-left:auto;color:var(--sub);font-size:11.5px;white-space:nowrap}
.row .s{color:var(--sub);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.b-new{background:var(--y);color:#000}.b-ok{background:var(--okb);color:var(--ok)}.b-wr{background:var(--wrb);color:var(--wr)}
.b-er{background:var(--erb);color:var(--er)}.b-in{background:var(--inb);color:var(--in)}.b-mute{background:var(--card2);color:var(--sub);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi .l{color:var(--sub);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:30px;font-weight:900;font-style:italic;line-height:1.1;margin-top:6px}
.kpi .d{color:var(--sub);font-size:12px;margin-top:2px}
.kpi.y{background:var(--y);border-color:var(--y);color:#000}.kpi.y .l,.kpi.y .d{color:#2a2a00}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--sub)}
h2{font-weight:900;font-style:italic;text-transform:uppercase;font-size:16px;margin:22px 0 10px;letter-spacing:.2px}
h2:first-child{margin-top:0}
h3{font-size:14px;font-weight:800;margin:16px 0 8px}
.muted{color:var(--sub)}
.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--sub);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.btn:hover{border-color:var(--sub)}
.btn.p{background:var(--y);border-color:var(--y);color:#000}
.btn.p:hover{filter:brightness(.95)}
.btn.ok{background:var(--okb);border-color:transparent;color:var(--ok)}
.btn.er{background:var(--erb);border-color:transparent;color:var(--er)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.dhead{display:flex;gap:12px;align-items:flex-start}
.dhead .ttl{font-weight:900;font-style:italic;font-size:22px;text-transform:uppercase;line-height:1.15}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px;margin:12px 0}
.meta dt{color:var(--sub)}.meta dd{margin:0}
.body{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.files{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.file{width:132px;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--card)}
.file img{display:block;width:100%;height:96px;object-fit:cover;background:#fff}
.file div{font-size:11.5px;padding:6px 8px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:14px}
.hist div{position:relative;margin:0 0 10px;font-size:12.5px}
.hist div:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--y)}
.hist i{color:var(--sub);font-style:normal;margin-right:6px}
.msg{max-width:78%;border-radius:14px;padding:10px 12px;margin:8px 0;border:1px solid var(--line);background:var(--card)}
.msg.me{margin-left:auto;background:var(--y);color:#000;border-color:var(--y)}
.msg.pres{border-color:var(--in);background:var(--inb)}
.msg small{display:block;opacity:.7;font-size:11px;margin-bottom:3px;font-weight:700}
.empty{color:var(--sub);text-align:center;padding:60px 20px}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.bar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--y)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-weight:600;font-size:12.5px;background:var(--card)}
.seg button.on{background:var(--y);color:#000}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ev{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev .tm{font-weight:700;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.switch{all:unset;cursor:pointer;width:38px;height:22px;border-radius:20px;background:var(--line);position:relative;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--y)}.switch.on:after{left:19px;background:#000}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow div{flex:1}
.pres-preview{border:2px dashed var(--in);border-radius:14px;padding:14px;margin-top:14px}
.tg{background:#17212B;color:#fff;border-radius:12px;padding:12px;font-size:13px;max-width:420px}
:root[data-theme="light"] .tg{background:#EAF2FA;color:#000}
.tg .kb{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.tg .kb span{background:rgba(255,255,255,.12);border-radius:6px;text-align:center;padding:6px;font-size:12px}
:root[data-theme="light"] .tg .kb span{background:#fff}
/* модальне вікно */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 12px;font-weight:900;font-style:italic;text-transform:uppercase;font-size:17px}
.modal label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin:12px 0 4px}
.modal textarea,.modal input,.modal select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}
.modal textarea{min-height:90px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;border:1px solid var(--line);font-weight:600;font-size:12.5px;background:var(--card)}
.opt.on{background:var(--y);border-color:var(--y);color:#000}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000;color:#fff;border:1px solid var(--y);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90vw}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:70;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
pre.out{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0}
.yline{height:4px;background:var(--y);border-radius:2px;width:48px;margin:6px 0 0}
/* вузький екран (телефон) */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid #1a1a1a;overflow:hidden}
  .brand{border:0;padding:10px 12px}.brand b{font-size:15px}.brand small,.side-foot{display:none}
  .nav{display:flex;gap:4px;overflow-x:auto;padding:8px}
  .nav button{width:auto;white-space:nowrap;padding:7px 10px}
  .top{padding:10px 14px;flex-wrap:wrap}.search{min-width:0;flex:1 1 100%;order:5}
  .content{padding:14px}
  .content.split{grid-template-columns:1fr}
  .content.split.has-sel .pane.list{display:none}
  .content.split:not(.has-sel) .pane.detail{display:none}
  .btn.mback{display:inline-flex;margin-bottom:10px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .pane.detail{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>Сокіл <span>Цифровий</span></b><small>Кабінет виконавчого директора</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="who" id="who">Демо-директор</div><div id="clock"></div></div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="title">Головна</h1>
      <span class="demo-flag" title="Дані вигадані; дії нічого не змінюють у системі">ДЕМО</span>
      <span class="sp"></span>
      <label class="search"><span>🔎</span><input id="q" placeholder="Пошук: член ГО, дитина, № картки…" autocomplete="off"></label>
      <button class="iconbtn" id="themeBtn" title="Тема">🌙 Темна</button>
      <button class="iconbtn" id="fsBtn" title="На весь екран">⛶</button>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<script>
"use strict";
/* ═══════════════════════════ ДЕМО-ДАНІ ═══════════════════════════
   Усі люди, номери й суми вигадані. Справжніх персональних даних тут немає (сторінка в публічному репозиторії).
   Етап 2: шар API (нижче) замість DEMO звертатиметься до Сокіл Цифровий — екрани не зміняться. */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rnd() * a.length)];
const SUR = ["Коваленко","Бондаренко","Ткаченко","Кравченко","Шевчук","Мельник","Олійник","Поліщук","Лисенко","Руденко","Савченко","Петренко","Марченко","Клименко","Павленко","Левченко","Гуменюк","Захарченко","Остапчук","Яковенко","Тимошенко","Гончар","Демченко","Сидоренко","Мороз","Литвин","Кузьмич","Зінченко","Онищенко","Білик"];
const BOY = ["Андрій","Максим","Артем","Назар","Марк","Матвій","Денис","Іван","Данило","Тимур","Захар","Олександр","Михайло","Кирило","Богдан","Святослав","Ярослав","Влад","Роман","Нікіта"];
const MOM = ["Олена","Ірина","Наталія","Оксана","Тетяна","Юлія","Світлана","Марія","Катерина","Вікторія","Анна","Людмила"];
const DAD = ["Сергій","Олег","Віталій","Дмитро","Ігор","Василь","Павло","Юрій","Руслан","Євген"];
const PAT_M = ["Миколаївна","Петрівна","Іванівна","Сергіївна","Олегівна","Василівна","Андріївна"];
const PAT_D = ["Миколайович","Петрович","Іванович","Сергійович","Олегович","Васильович","Андрійович"];
const FEE = 2500;
const COACHES = [
  {id:"T1", name:"Бондар Олег Вікторович", role:"Старший тренер", tg:true, access:"Суми"},
  {id:"T2", name:"Гриценко Віталій Ігорович", role:"Старший тренер", tg:true, access:"Суми"},
  {id:"T3", name:"Мазур Дмитро Олександрович", role:"Старший тренер", tg:true, access:"Без сум"},
  {id:"T4", name:"Ковальчук Андрій Сергійович", role:"Тренер", tg:true, access:"Без сум"},
  {id:"T5", name:"Савчук Ігор Петрович", role:"Тренер", tg:false, access:"Без сум"},
  {id:"T6", name:"Остапенко Роман Юрійович", role:"Асистент", tg:true, access:"Без сум"},
];
const GROUPS = [
  {g:"2011-2012", senior:"T1", coaches:["T1","T6"], n:10},
  {g:"2012-2013", senior:"T1", coaches:["T1","T6"], n:14},
  {g:"2014-2015", senior:"T2", coaches:["T2","T4"], n:16},
  {g:"2014-2015(2)", senior:"T2", coaches:["T2"], n:11},
  {g:"2016-2017", senior:"T3", coaches:["T3","T4"], n:21},
  {g:"2016-2017(2)", senior:"T3", coaches:["T3","T5"], n:8},
  {g:"2018", senior:"T3", coaches:["T3","T5"], n:27},
  {g:"2019", senior:"T2", coaches:["T2","T5"], n:19},
  {g:"2020+", senior:"T1", coaches:["T1","T6"], n:9},
];
const coach = id => COACHES.find(c => c.id === id) || {name:"—"};
const short = n => { const p = n.split(" "); return p[0] + " " + (p[1] || "").charAt(0) + "."; };
const fmt = n => (Math.round(n)).toLocaleString("uk-UA").replace(/,/g, " ") + " грн";
const MONTHS = ["вересень","жовтень","листопад","грудень","січень","лютий","березень","квітень","травень","червень"];
const NOW_MONTH = 2; // листопад

const members = [], kids = [];
let mN = 1000, kN = 1000;
GROUPS.forEach(G => {
  const y0 = parseInt(G.g, 10) || 2020;
  for (let i = 0; i < G.n; i++) {
    const sur = pick(SUR), mom = rnd() < .75;
    let m;
    if (rnd() < .1 && members.length > 5) { m = pick(members); } // брати й сестри — той самий член ГО
    else {
      const first = mom ? pick(MOM) : pick(DAD);
      m = {id: "А-" + (++mN), sur, first, pat: mom ? pick(PAT_M) : pick(PAT_D), cat: rnd() < .9 ? "Асоційований" : "Дійсний",
           status: "Активний", phone: "+38067" + String(1000000 + Math.floor(rnd() * 8999999)), tg: rnd() < .52, benefit: 0, kids: [],
           trusted: rnd() < .08 ? [{name: pick(MOM) + " (бабуся)", rights: "Перегляд"}] : [], email: rnd() < .5 ? "demo" + mN + "@example.com" : ""};
      members.push(m);
    }

function nowStr() { const d = new Date(); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + " " + d.toTimeString().slice(0, 5); }
function cardActions(x) {
  const closed = ["approved","rejected","answered","closed"].includes(x.status);
  if (closed) return `<span class="muted small">Картку закрито. Відповідь і рішення — в історії.</span>`;
  const dec = {
    join:`<button class="btn ok" data-act="approve">✅ Прийняти</button><button class="btn er" data-act="reject">❌ Відхилити</button>`,
    booking:`<button class="btn ok" data-act="approve">✅ Погодити</button><button class="btn er" data-act="reject">❌ Відхилити</button>`,
    absence:`<button class="btn p" data-act="approve">📋 Погодити перерахунок</button><button class="btn er" data-act="reject">❌ Відхилити</button>`,
    doc:`<button class="btn ok" data-act="approve">✅ Прийняти документ</button><button class="btn er" data-act="reject">❌ Не той документ</button>`,
    request:`<button class="btn ok" data-act="approve">✅ Дозволити</button><button class="btn er" data-act="reject">❌ Ні</button>`,
    transfer:`<button class="btn ok" data-act="approve">✅ Погодити</button><button class="btn er" data-act="reject">❌ Відхилити</button>`,
    trial:`<button class="btn" data-act="remind">🔔 Нагадати тренеру</button>`,
  }[x.type] || "";
  return dec + `<button class="btn" data-act="reply">✍️ Відповісти</button>`
    + (x.type === "support" ? `<button class="btn" data-act="pres">🤝 На розгляд президенту</button>` : "")
    + `<button class="btn" data-act="work">⏳ В роботі</button><button class="btn" data-act="extend">⏩ Продовжити</button>`
    + (x.type !== "booking" ? `<button class="btn" data-act="close">🏁 Закрити</button>` : "");
}
function cardAct(x, a) {
  const done = (status, h, msg) => { if (status) x.status = status; x.hist.push([nowStr(), h]); api.act(a, {id: x.id}); demoDone(msg); render(); };
  if (a === "approve") return done("approved", "✅ Погоджено директором", "погоджено, автор отримає повідомлення");
  if (a === "reject") return askText("Причина відмови", "Автор побачить цей текст", t => done("rejected", "❌ Відхилено" + (t ? ": " + t : ""), "відхилено"));
  if (a === "work") return done("work", "⏳ В роботі", "статус «В роботі»");
  if (a === "extend") { x.due = "+1 роб. день"; return done(null, "⏩ Продовжено розгляд на 1 робочий день", "строк продовжено"); }

  if (a === "pres") { const ap = {id:"ЗВР-00" + (13 + appeals.length), member:M(7).id, topic:"Фінансова підтримка", when:x.when, status:"new", thread:[{who:"m", t:x.when, text:x.text}], files:x.files}; appeals.unshift(ap); x.status = "work"; x.hist.push([nowStr(), "📨 Перенесено у «Звернення» → " + ap.id]); presModal(ap); }
}

  c.querySelector("#book").onclick = () => modal(`<h3>📌 Бронь приміщення</h3><label>Приміщення</label><select>${ROOMS.map(r => `<option>${r}</option>`).join("")}</select><label>Дата</label><input type="date" value="2026-11-14"><label>Час</label><input placeholder="18:00–19:30"><label>Назва</label><input placeholder="Нарада тренерів">

/* 📊 Звіти */
VIEWS.reports = c => {
  const tab = st.tab.reports || "use";
  const T = [["use","📱 Хто користується"],["disc","📝 Дисципліна відвідування"],["absent","😴 Не ходять"],["week","📨 Звернення за тиждень"]];
  let html = `<div class="toolbar"><div class="seg">${T.map(t => `<button class="${tab === t[0] ? "on" : ""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div></div>`;
  if (tab === "use") {
    const rows = GROUPS.map(G => { const fam = [...new Set(kids.filter(k => k.g === G.g && k.status !== "Припинений").map(k => k.member))]; const on = fam.filter(id => memById(id).tg).length; return {g: G.g, fam: fam.length, on}; });
    const F = rows.reduce((s, r) => s + r.fam, 0), O = rows.reduce((s, r) => s + r.on, 0);
    html += `<div class="grid g3"><div class="card kpi y"><div class="l">Родин у Сокіл Цифровий</div><div class="v">${Math.round(O / F * 100)}%</div><div class="d">${O} з ${F}</div></div></div>
      <h2>По групах</h2><table><tr><th>Група</th><th class="num">Родин</th><th class="num">Підключено</th><th style="width:40%">%</th></tr>${rows.sort((a, b) => b.on / b.fam - a.on / a.fam).map(r => `<tr><td><b>${r.g}</b></td><td class="num">${r.fam}</td><td class="num">${r.on}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:${Math.round(r.on / r.fam * 100)}%"></i></div><b style="width:40px;text-align:right">${Math.round(r.on / r.fam * 100)}%</b></div></td></tr>`).join("")}</table>
      <div class="actions"><button class="btn p" data-x="list">📋 Список непідключених — старшим тренерам</button></div>`;
  } else if (tab === "disc") {
    html += `<h2>Минулий тиждень · по тренерах</h2><table><tr><th>Тренер</th><th class="num">Тренувань</th><th class="num">Постфактум</th><th class="num">Внесено < 2 год</th><th class="num">Виправлень</th></tr>${COACHES.slice(0, 5).map((x, i) => `<tr><td>${esc(short(x.name))}</td><td class="num">${6 + i}</td><td class="num">${i % 3}</td><td class="num">${i % 2}</td><td class="num">${i === 2 ? 1 : 0}</td></tr>`).join("")}</table>`;
  } else if (tab === "absent") {
    const l = kids.filter(k => k.lastSeen > 21 && k.status === "Активний");
    html += `<h2>Не ходять понад 3 тижні · ${l.length}</h2><table><tr><th>Дитина</th><th>Група</th><th class="num">Днів</th><th>Відповідь родини</th></tr>${l.map(k => `<tr class="click" data-kid="${k.id}"><td>${esc(kname(k))}</td><td>${k.g}</td><td class="num">${k.lastSeen}</td><td class="muted">${pick(["—","повернемося","хворіє","інша причина"])}</td></tr>`).join("")}</table>`;
  } else {
    html += `<div class="grid g4"><div class="card kpi"><div class="l">Надійшло</div><div class="v">14</div></div><div class="card kpi"><div class="l">Закрито вчасно</div><div class="v">11</div></div><div class="card kpi"><div class="l">Прострочено</div><div class="v">2</div></div><div class="card kpi"><div class="l">Середній час</div><div class="v">5 год</div></div></div>`;
  }
  c.innerHTML = html;
  c.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { st.tab.reports = b.dataset.tab; render(); });
  c.querySelectorAll("[data-kid]").forEach(b => b.onclick = () => go("members", b.dataset.kid));
  c.querySelectorAll("[data-x]").forEach(b => b.onclick = () => demoDone("кожен старший тренер отримає список родин своїх груп"));
};

/* 👁 Кабінети й демо */

    <p class="muted small">Перегляд відкривається в чаті Сокіл Цифровий (як зараз): усі кнопки, нічого не зберігається.</p>`;
  c.querySelectorAll("[data-r]").forEach(b => b.onclick = () => demoDone("кабінет «" + b.dataset.r + "» відкриється в чаті в режимі перегляду"));
};

/* 🛠 Технічне */

  ["📑 Перевірка аркушів","/sheets_check",`Усі аркуші й колонки на місці.\nВітрини без помилок.\nЗаповненість: «Інформація для бота» 3 %, «Сокіл · Дані бота» 7 %.`],
  ["💾 Резервна копія зараз","/backup",`Архів sokil-2026-11-12.zip (2,1 МБ) — перевірено, відновлюється.\nЗавантажено на обидва Диски.`],
  ["🛟 Знімок таблиць","/gtest snap",`Знімок: 18 наборів, 23 запити, найстаріший — 7 хв тому.`],
  ["📜 Журнал помилок","/logs",`12.11 03:12 INFO backup ok\n11.11 22:40 WARN Google 503 — повтор успішний`],
  ["⛔ Недопуск за борг","/debt_block",`Зараз не допущено: 3 дітей.\nСьогодні заблокувало б: 3.`],
  ["📝 Дисципліна відвідування","/att_week","Звіт за минулий тиждень надіслано вам у чат."],
  ["📄 Хто без документа","/docs_missing",`Без документа: 37 дітей (активні).`]];
VIEWS.tech = c => {
  c.innerHTML = `<div class="grid g4"><div class="card kpi"><div class="l">Сокіл Цифровий</div><div class="v" style="color:var(--ok)">✅</div><div class="d">працює 3 д 4 год</div></div><div class="card kpi"><div class="l">Google</div><div class="v" style="color:var(--ok)">✅</div><div class="d">черга записів: 0</div></div><div class="card kpi"><div class="l">Копія</div><div class="v">03:12</div><div class="d">2 з 2 дисків</div></div><div class="card kpi"><div class="l">Помилок / добу</div><div class="v">0</div></div></div>
    <h2>Команди адміністратора</h2><div class="grid g4">${CMDS.map((x, i) => `<button class="card kpi click" style="text-align:left" data-cmd="${i}"><div style="font-weight:800">${x[0]}</div><div class="muted small">${x[1]}</div></button>`).join("")}</div>
    <div id="out" style="margin-top:14px"></div>`;
  c.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => { const x = CMDS[+b.dataset.cmd]; c.querySelector("#out").innerHTML = `<div class="card"><h3 style="margin-top:0">${x[0]} <span class="muted small">${x[1]}</span></h3><pre class="out">${esc(x[2])}</pre></div>`; });
};

/* 🔔 Налаштування */
const NOTIF = [["absence","📅 Відсутність дітей",true],["exit","🚪 Відрахування й вихід з ГО",true],["debts","📬 Зведення розсилки нагадувань (15-го і 28-го)",true],["coaches","👥 Зміни тренерів і переведення старшими",true],["trusted","🤝 Довірені особи членів ГО",false],["comments","💬 Коментарі тренерів до відвідування",true]];
VIEWS.settings = c => {
  c.innerHTML = `<div class="grid g2"><div class="card"><h2>🔔 Мої сповіщення</h2><div class="setrow"><div>Час сповіщень</div><b>10:00–19:00</b></div>
    ${NOTIF.map(n => `<div class="setrow"><div>${n[1]}</div><button class="switch ${n[2] ? "on" : ""}" data-n="${n[0]}"></button></div>`).join("")}
    <p class="muted small">Не вимикаються: звернення в підтримку, переведення в групи без старшого тренера, нові вихованці без групи, конфлікти, технічні.</p></div>
    <div class="card"><h2>🎨 Вигляд</h2><div class="setrow"><div>Тема</div><div class="seg" style="flex:none"><button data-th="dark">🌙 Темна</button><button data-th="light">☀️ Світла</button></div></div>
    <h2>📝 Тексти й налаштування</h2><div class="small">Тексти «Про клуб», «Важливо знати», нагадування — аркуші «Інформація для бота».<br>Базовий внесок: <b>${fmt(FEE)}</b></div></div></div>`;
  c.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { const n = NOTIF.find(x => x[0] === b.dataset.n); n[2] = !n[2]; b.classList.toggle("on"); demoDone("налаштування збережено"); });
  c.querySelectorAll("[data-th]").forEach(b => { b.classList.toggle("on", theme() === b.dataset.th); b.onclick = () => { setTheme(b.dataset.th); render(); }; });
};

/* ═══════════════════════════ ТЕМА, TELEGRAM, СТАРТ ═══════════════════════════ */
function theme() { return document.documentElement.dataset.theme === "light" ? "light" : "dark"; }
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#themeBtn").textContent = t === "light" ? "☀️ Світла" : "🌙 Темна";
  try { localStorage.setItem("sokil_theme", t); } catch (e) {}
  const tg = window.Telegram && Telegram.WebApp; if (tg && tg.setHeaderColor) { try { tg.setHeaderColor("#000000"); tg.setBackgroundColor(t === "light" ? "#F4F4F1" : "#0A0A0A"); } catch (e) {} }
}
(function init() {
  let t = "dark"; try { t = localStorage.getItem("sokil_theme") || "dark"; } catch (e) {}
  setTheme(t);
  $("#themeBtn").onclick = () => { setTheme(theme() === "light" ? "dark" : "light"); if (st.sec === "settings") render(); };
  const tg = window.Telegram && Telegram.WebApp;
  if (tg && tg.initData) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user; if (u) $("#who").textContent = (u.first_name || "") + " " + (u.last_name || "") + " · демо";
  }
  $("#fsBtn").onclick = () => {
    if (tg && tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) { try { tg.isFullscreen ? tg.exitFullscreen() : tg.requestFullscreen(); return; } catch (e) {} }
    const d = document; if (d.fullscreenElement) d.exitFullscreen && d.exitFullscreen(); else d.documentElement.requestFullscreen && d.documentElement.requestFullscreen().catch(() => toast("Повний екран недоступний"));
  };
  $("#q").addEventListener("input", e => {
    st.q = e.target.value.trim(); const v = st.q.toUpperCase();
    if (/^З-\d{4}$/.test(v) && inbox.find(x => x.id === v)) return go("inbox", v);
    if (/^ЗВР-\d{4}$/.test(v) && appeals.find(x => x.id === v)) return go("appeals", v);
    if (st.sec !== "members") { st.sec = "members"; } render();
    const inp = $("#q"); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  });
  const clock = () => { const d = new Date(); $("#clock").textContent = d.toLocaleDateString("uk-UA", {weekday:"long", day:"numeric", month:"long"}) + " · " + d.toTimeString().slice(0, 5); };
  clock(); setInterval(clock, 30000);
  // Посилання з чату «🖥 Відкрити»: #inbox/З-0141 або ?startapp=inbox_З-0141 (етап 2)
  const h = decodeURIComponent((location.hash || "").slice(1)); const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const [sec, sel] = (h || (sp ? sp.replace("_", "/") : "")).split("/");
  if (sec && SECTIONS.find(s => s[0] === sec)) { st.sec = sec; if (sel) st.sel[sec] = sel; }
  render();
})();
</script>
