<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Відвідування · СФК «Сокіл»</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f6);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #2e9d4f;
    --bad: #d6423a;
    --line: rgba(127, 127, 127, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg2); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 96px;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg2);
    padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .count { flex: 1; font-weight: 600; }
  .count b { color: var(--ok); }
  button.all {
    border: 0; border-radius: 10px; padding: 9px 12px; font-size: 15px; font-weight: 600;
    background: var(--bg); color: var(--accent);
  }
  ul { list-style: none; margin: 12px 12px 0; padding: 0; background: var(--bg); border-radius: 12px; overflow: hidden; }
  li { border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; cursor: pointer; user-select: none; }
  .num { width: 22px; color: var(--hint); font-size: 14px; text-align: right; flex: none; }
  .name { flex: 1; }
  .hint { display: block; color: var(--hint); font-size: 13px; }
  .mark {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-size: 18px; font-weight: 700; color: #fff; background: var(--ok);
  }
  li.absent .mark { background: var(--bad); }
  li.absent .name { color: var(--bad); }
  .reasons { display: none; gap: 6px; padding: 0 14px 12px 48px; flex-wrap: wrap; }
  li.absent .reasons { display: flex; }
  .reasons button {
    border: 1px solid var(--line); background: var(--bg2); color: var(--text);
    border-radius: 16px; padding: 6px 12px; font-size: 14px;
  }
  .reasons button.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .note { margin: 12px; background: var(--bg); border-radius: 12px; padding: 10px 14px; }
  .note label { display: block; color: var(--hint); font-size: 13px; margin-bottom: 6px; }
  .note textarea {
    width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    font: inherit; color: var(--text); background: var(--bg2); resize: vertical;
  }
  .err { margin: 24px 16px; padding: 16px; background: var(--bg); border-radius: 12px; }
  footer { color: var(--hint); font-size: 13px; padding: 12px 16px; }
  #save {
    position: fixed; left: 12px; right: 12px; bottom: 12px; border: 0; border-radius: 12px;
    padding: 15px; font-size: 16px; font-weight: 700; background: var(--accent); color: var(--accent-text);
    display: none;
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Відвідування</h1>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <div class="count" id="count"></div>
    <button class="all" id="all" type="button">✅ Усі присутні</button>
  </div>
</header>
<ul id="list"></ul>
<div class="note">
  <label for="comment">💬 Коментар (необов'язково) — його отримає директор</label>
  <textarea id="comment" maxlength="1000" placeholder="Наприклад: тренування перенесли на поле зелене"></textarea>
</div>
<footer>Натисніть на дитину, щоб позначити відсутність, і оберіть причину. Ще раз — знову «присутній».</footer>
<button id="save" type="button">💾 Зберегти</button>

<script>
(function () {
  "use strict";
  var REASONS = [["s", "🤒 Хворіє"], ["p", "📩 Повідомили"], ["n", "❔ Без причини"]];
  var tg = window.Telegram && window.Telegram.WebApp;
  var data = null;

  function decode(part) {
    var s = part.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  // Telegram дописує до адреси свої параметри (#…&tgWebAppVersion=…&tgWebAppData=…),
  // тому шукаємо наш список серед частин адреси після «#», а не беремо її цілком.
  var why = "h0";
  var hash = (location.hash || "").replace(/^#/, "");
  if (hash) {
    why = "h1";
    var parts = hash.split("&");
    for (var p = 0; p < parts.length && !data; p++) {
      var part = parts[p];
      if (!part || part.indexOf("=") > 0 && /^tgWebApp/.test(part)) continue;
      try { data = decode(decodeURIComponent(part)); } catch (e) { data = null; }
    }
  }

  if (tg) { tg.ready(); tg.expand(); }

  if (!data || data.v !== 1 || !Array.isArray(data.k)) {
    document.getElementById("list").outerHTML =
      '<div class="err">Список не завантажено. Поверніться в бот і відкрийте його ще раз кнопкою «📝 Відкрити список».' +
      '<br><small>Код: ' + why + (tg ? "·" + (tg.platform || "?") + "·" + (tg.version || "?") : "·notg") + '</small></div>';
    document.getElementById("all").style.display = "none";
    return;
  }

  // state[i] = "" — присутній, або код причини відсутності
  var state = data.k.map(function (k) { return k[1] || ""; });

  document.getElementById("title").textContent = "Група " + data.g;
  if (typeof data.c === "string") document.getElementById("comment").value = data.c;
  document.getElementById("sub").textContent = data.d;

  var list = document.getElementById("list");
  data.k.forEach(function (k, i) {
    var li = document.createElement("li");
    var row = document.createElement("div");
    row.className = "row";
    var num = document.createElement("span");
    num.className = "num"; num.textContent = i + 1;
    var name = document.createElement("span");
    name.className = "name"; name.textContent = k[0];
    if (k[2]) {
      var h = document.createElement("span");
      h.className = "hint"; h.textContent = "📩 батьки повідомили про відсутність";
      name.appendChild(h);
    }
    var mark = document.createElement("span");
    mark.className = "mark";
    row.appendChild(num); row.appendChild(name); row.appendChild(mark);
    var reasons = document.createElement("div");
    reasons.className = "reasons";
    REASONS.forEach(function (r) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = r[1]; b.dataset.code = r[0];
      b.addEventListener("click", function (ev) {
        ev.stopPropagation(); state[i] = r[0]; render(); haptic();
      });
      reasons.appendChild(b);
    });
    row.addEventListener("click", function () {
      state[i] = state[i] ? "" : (k[2] && k[1]) ? k[1] : "n";
      render(); haptic();
    });
    li.appendChild(row); li.appendChild(reasons);
    list.appendChild(li);
  });

  document.getElementById("all").addEventListener("click", function () {
    state = state.map(function () { return ""; }); render(); haptic();
  });

  function haptic() {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }

  function render() {
    var present = 0;
    Array.prototype.forEach.call(list.children, function (li, i) {
      var absent = !!state[i];
      if (!absent) present++;
      li.classList.toggle("absent", absent);
      li.querySelector(".mark").textContent = absent ? "✕" : "✓";
      Array.prototype.forEach.call(li.querySelectorAll(".reasons button"), function (b) {
        b.classList.toggle("on", b.dataset.code === state[i]);
      });
    });
    document.getElementById("count").innerHTML =
      "Присутні <b>" + present + "</b> з " + state.length;
    var label = "💾 Зберегти · присутні " + present + " з " + state.length;
    if (tg && tg.MainButton) {
      tg.MainButton.setText(label);
      tg.MainButton.show();
    } else {
      var s = document.getElementById("save"); s.textContent = label; s.style.display = "block";
    }
  }

  function send() {
    var absent = [];
    state.forEach(function (r, i) { if (r) absent.push([i, r]); });
    var comment = document.getElementById("comment").value.replace(/\s+/g, " ").trim().slice(0, 1000);
    var payload = JSON.stringify({ v: 1, t: data.t, a: absent, c: comment });
    if (tg && tg.sendData) {
      tg.sendData(payload);  // Telegram передає відповідь боту і закриває сторінку
    } else {
      alert("Відкрийте сторінку з бота в Telegram.");
    }
  }

  if (tg && tg.MainButton) tg.MainButton.onClick(send);
  document.getElementById("save").addEventListener("click", send);
  render();
})();
</script>
</body>
</html>
